name: Release (npm)

# Publishes @selectwin/mcp to npm on a version tag (vX.Y.Z), tokenless via npm
# Trusted Publishing (OIDC) + build provenance.
#
# One-time setup on npmjs.com (Package → Settings → Trusted Publisher):
#   Publisher = GitHub Actions, org/repo = selectwin/mcp,
#   workflow = release.yml, environment = npm.
# With that in place no NPM_TOKEN secret is needed (or set NPM_TOKEN to bootstrap
# the first publish).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC token exchange for Trusted Publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@selectwin/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing requires npm >= 11.5.1 (newer than what setup-node ships).
      - name: Update npm
        run: npm install -g npm@latest
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
      - name: Guard — is this version already on npm?
        id: guard
        # Idempotency gate: a re-run or re-pushed tag of an ALREADY-published version
        # must be a clean no-op, never a failed or duplicate publish.
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "@selectwin/mcp@$VER" version >/dev/null 2>&1; then
            echo "::notice::@selectwin/mcp@$VER is already on npm — skipping publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install deps
        if: steps.guard.outputs.published != 'true'
        run: npm ci
      - name: Build
        if: steps.guard.outputs.published != 'true'
        run: npm run build
      - name: Test
        if: steps.guard.outputs.published != 'true'
        run: npm test
      - name: Publish to npm
        if: steps.guard.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
